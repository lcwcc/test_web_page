<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <span class="brand-mark">ME</span>
        <span>{{ site.title }}</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Journal</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div>
        <strong>{{ site.title }}</strong>
        <p>Research literacy for complex metabolic evidence.</p>
      </div>
      <p class="fine-print">Educational information only. Not medical advice, diagnosis, or treatment guidance.</p>
    </footer>
  </body>
</html>
